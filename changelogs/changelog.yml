releases:
  - name: "Initial Release"
    tag: "v1.0.0"
    version: "1.0.0"
    changes:
      - major_changes:
          - Initial release of the `ravendb.ravendb` collection.
          - Added `ravendb_node` role for setting up RavenDB servers.
          - Added `ravendb_python_client_prerequisites` role for Python dependency management.
          - Added modules:
              - "`ravendb.ravendb.database` to manage RavenDB databases."
              - "`ravendb.ravendb.index` to manage RavenDB indexes and index modes."
              - "`ravendb.ravendb.node` to add nodes to a RavenDB cluster."

  - name: "Compliance & Cosmetic Updates"
    tag: "v1.0.1"
    version: "1.0.1"
    changes:
      - fixed:
          - Updated `issues` field in `galaxy.yml` to point to the collection repo.
          - Removed broken Keep a Changelog URL in `CHANGELOG.md`.
          - Added `attributes` section with `check_mode` support to all modules.
          - Fixed usage of FQCNs in roles and playbooks.
          - Cleaned up unnecessary files - `ansible.cfg`, `inventories/`, etc.
          - Expanded CI matrix: added `stable-2.18`, `stable-2.19`, and `Python 2.7` support.

  - name: "Refactor Node Module & Shared Args"
    tag: "v1.0.2"
    version: "1.0.2"
    changes:
      - changed:
          - Flattened argument structure in `ravendb.ravendb.node` module (removed nested `node:` dictionary).
          - Centralized common arguments (`url`, `database_name`, `certification_path`, `ca_cert_path`) under `module_utils` and `doc_fragments` for reuse across modules.
      - fixed:
          - Ensured all modules properly import and expose shared options from centralized definitions.

  - name: "Encrypted DB &  Cluster Enhancements"
    tag: "v1.0.3"
    version: "1.0.3"
    changes:
      - added:
          - Support for encrypted databases in `ravendb.ravendb.database`:
              - Generate or read encryption keys.
              - Distribute keys across all cluster nodes.
              - Create databases with encryption enabled.
          - Ability to manage database settings via the `ravendb.ravendb.database` module.
          - Joining Let's Encrypt–secured nodes into existing RavenDB clusters.

  - name: "Placement & Index Configuration & Healthcheck Module & Connection string Module "
    tag: "v1.0.4"
    version: "1.0.4"
    changes:
      - added:
          - Database placement controls in `ravendb.ravendb.database`:
              - Fixed placement via `topology_members` to deploy on specific node tags.
          - Index deployment mode in `ravendb.ravendb.index` (rolling/parallel).
          - Per-index configuration reconciliation in `ravendb.ravendb.index` via `index_configuration`.
          - New `ravendb.ravendb.healthcheck` module:
              - Checks - `node_alive`, `cluster_connectivity`, `db_groups_available`, `db_groups_available_excluding_target`.
              - TLS options - `validate_certificate`, `certificate_path`, `ca_cert_path`.
              - Timing/behavior - `max_time_to_wait`, `retry_interval_seconds`, `db_retry_interval_seconds`, `on_db_timeout`.
              - Read-only operation; auto-disables cert validation for IP hosts on node/cluster checks.
          - New `ravendb.ravendb.connection_string` module:
              - Manage RavenDB connection strings (create/delete).
              - Providers supported -  `RAVEN`, `SQL`, `OLAP`, `ELASTIC_SEARCH`, `QUEUE` (Kafka, RabbitMQ, AzureQueueStorage, AmazonSQS), `SNOWFLAKE`, `AI`.
              - Check mode support.
      - changed:
          - Modularized the project structure and internals for clearer responsibilities and easier maintenance.

  - name: "RavenDB Cloud Modules"
    tag: "v1.1.0"
    version: "1.1.0"
    changes:
      - added:
          - RavenDB Cloud control-plane support via six new modules that talk to the RavenDB Cloud API (X-Api-Key auth).
          - New `ravendb.ravendb.cloud_account_info` module - read account info.
          - New `ravendb.ravendb.cloud_metadata_info` module - discover release channels, per-provider regions, and per-region instance types (aws, azure, gcp).
          - New `ravendb.ravendb.cloud_product_info` module - list or filter cloud products by id or name, with optional detailed enrichment.
          - New `ravendb.ravendb.cloud_product` module - create, terminate, and reconcile drift on a cloud product (storage size/type/iops/throughput and instance_type). Immutable fields (tier, cloud_provider, region, subdomain) and fields with no change endpoint (allowed_ips, release_channel) fail loud on drift. `state=absent` gated behind an explicit `confirm_destroy=true` safety flag.
          - New `ravendb.ravendb.cloud_node` module - add, remove, and restart individual nodes on multi-node cloud products (PB and P instance types).
          - New `ravendb.ravendb.cloud_certificate` module - download the product client PKCS12 certificate to a local path. Idempotent by byte-equality; writes with 0o600 and refuses to follow symlinks.
          - Shared documentation fragments `ravendb.ravendb.ravendb_cloud` (api_key/api_url/check_mode) and `ravendb.ravendb.ravendb_cloud_wait` (wait/wait_timeout for async operations).
          - Live-test suite under `tests/live/cloud_*.yml` (not run in CI - driven manually against a sandbox account) covering account, metadata, product errors/info/lifecycle (aws/azure/gcp), node add/remove/restart, certificate download+drift, and full drift reconciliation.
          - Unit tests under `tests/unit/test_cloud.py` covering validation and reconciler paths (mocked API).
